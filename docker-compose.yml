version: '3.8'
services:
  app_prod:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: laravel_prod
    volumes:
      - storage_prod:/var/www/html/storage
    ports:
      - "9003:80"
    restart: always

  app_stage:
    build:
      context: .
      dockerfile: dockerfiles/stage.Dockerfile
    container_name: laravel_stage
    volumes:
      - storage_stage:/var/www/html/storage
    ports:
      - "9004:80"
    restart: always

  app_dev:
    build:
      context: .
      dockerfile: dockerfiles/dev.Dockerfile
    container_name: laravel_dev
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db_dev:
        condition: service_healthy
    restart: no

  db_dev:
    image: postgres:18
    container_name: postgres_dev
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: laravel_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storage_prod:
  storage_stage:
  postgres_data: