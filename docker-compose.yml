version: '3.8'
services:
  app_prod:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    container_name: laravel_prod
    volumes:
      - storage_prod:/var/www/html/storage
    ports:
      - "9003:80"
    restart: always

  app_stage:
    build:
      context: .
      dockerfile: dockerfiles/stage.Dockerfile
    container_name: laravel_stage
    volumes:
      - storage_stage:/var/www/html/storage
    ports:
      - "9004:80"
    restart: always

  app_dev:
    build:
      context: .
      dockerfile: dockerfiles/stage.Dockerfile
    container_name: laravel_dev
    volumes:
      - storage_stage:/var/www/html/storage
    restart: no
    ports:
      - "8000:8000"
    entrypoint: [ "sh", "-c", "php artisan migrate && php artisan serve --host=0.0.0.0" ]

volumes:
  storage_prod:
  storage_stage: